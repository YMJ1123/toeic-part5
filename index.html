<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>多益 Part 5 特訓</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow column like a test booklet; choices drawn as answer-sheet bubbles. */
:root {
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --line: #DCE1EA;
  --ink: #18202E;
  --muted: #5A6476;
  --accent: #2A55C9;
  --accent-soft: #E6ECFB;
  --mark: #FFE27A;
  --mark-ink: #18202E;
  --ok: #1D8253;
  --ok-soft: #E3F4EB;
  --bad: #C23B34;
  --bad-soft: #FBE7E5;
  --font-display: "Space Grotesk", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  --font-body: "Inter", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F131B; --surface: #171D28; --line: #2A3242; --ink: #E5E9F1; --muted: #98A1B3;
    --accent: #86A6FF; --accent-soft: #1E2A47; --mark: #5C4C0E; --mark-ink: #FFE9A0;
    --ok: #5FD39A; --ok-soft: #133426; --bad: #FF8A80; --bad-soft: #3A1A18; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F131B; --surface: #171D28; --line: #2A3242; --ink: #E5E9F1; --muted: #98A1B3;
  --accent: #86A6FF; --accent-soft: #1E2A47; --mark: #5C4C0E; --mark-ink: #FFE9A0;
  --ok: #5FD39A; --ok-soft: #133426; --bad: #FF8A80; --bad-soft: #3A1A18; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex; flex-direction: column; gap: 20px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.25; }
h1 { font-size: 1.75rem; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
.eyebrow { font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; flex-direction: column; gap: 6px; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stat b { color: var(--ink); font-weight: 600; }
.section-title { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }

/* topic list */
.topics { display: flex; flex-direction: column; gap: 10px; }
.topic {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; text-align: left; width: 100%;
}
.topic:active, .mode:active { transform: scale(0.99); }
.topic .num { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--font-display); font-weight: 700; }
.topic .t { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.topic .t span { font-size: 0.85rem; color: var(--muted); }
.meter { width: 64px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter i { display: block; width: 100%; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i::after { content: ""; display: block; height: 100%; width: var(--p, 0%); background: var(--ok); }

/* practice formats */
.modes { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 520px) { .modes { grid-template-columns: 1fr 1fr; } }
.mode {
  display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
}
.mode strong { font-family: var(--font-display); font-size: 1.02rem; }
.mode span.d { font-size: 0.88rem; color: var(--muted); }
.mode .for { display: flex; gap: 4px; flex-wrap: wrap; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 600; min-height: 48px; background: var(--accent); color: var(--surface); }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.grow { flex: 1 1 160px; }
.back { align-self: flex-start; background: none; border: 0; color: var(--accent); font-weight: 600; padding: 6px 0; min-height: 44px; }

/* rules */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.rules { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
.rule { display: flex; flex-direction: column; gap: 4px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.rule:last-child { border-bottom: 0; padding-bottom: 0; }
.rule .if { font-weight: 600; }
.rule .if em { font-style: normal; color: var(--accent); }
.ex { font-size: 0.92rem; color: var(--muted); }
.ex u { text-decoration: none; background: var(--mark); color: var(--mark-ink); padding: 0 3px; border-radius: 3px; }
.tip { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; font-size: 0.92rem; }
.tip strong { color: var(--accent); }
.words { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.85rem; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--bg); }
.stack { display: flex; flex-direction: column; gap: 6px; }

/* word family explorer */
.fam-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.fam-tabs button { flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; min-height: 40px; font-weight: 500; }
.fam-tabs button[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.fam { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
.fam td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.fam td:first-child { width: 64px; font-family: var(--font-display); font-size: 0.78rem; color: var(--muted); font-weight: 600; white-space: nowrap; padding-top: 11px; }
.fam td:nth-child(2) { font-weight: 600; }
.fam td:last-child { color: var(--muted); }
.twins { display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; }
.twins div { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.twins b { font-weight: 600; }

/* quiz */
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.progress { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.qcount { font-family: var(--font-display); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 18px; display: flex; flex-direction: column; gap: 18px; }
.qmeta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.qno { font-family: var(--font-display); font-weight: 700; color: var(--muted); font-size: 0.85rem; letter-spacing: 0.04em; }
.prompt { font-weight: 600; }
.sentence { font-size: 1.12rem; line-height: 1.75; }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--ink); text-align: center; padding: 0 4px; line-height: 1.3; }
.blank.filled { background: var(--mark); color: var(--mark-ink); border-bottom-color: transparent; border-radius: 4px; font-weight: 600; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 54px;
  font-size: 1.02rem;
}
.bubble {
  flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--muted);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 0.85rem; color: var(--muted);
}
.choice.right { border-color: var(--ok); background: var(--ok-soft); }
.choice.right .bubble { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.wrong .bubble { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.choice:disabled { cursor: default; }
.choice.dim { opacity: 0.55; }
.feedback { border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 0.95rem; }
.feedback.ok { background: var(--ok-soft); }
.feedback.no { background: var(--bad-soft); }
.feedback.info { background: var(--accent-soft); }
.feedback .verdict { font-weight: 700; font-family: var(--font-display); }
.feedback.ok .verdict { color: var(--ok); }
.feedback.no .verdict { color: var(--bad); }
.feedback.info .verdict { color: var(--accent); }
.feedback .zh { color: var(--muted); font-size: 0.88rem; }
.feedback b { font-weight: 600; }
.tag { display: inline-block; font-size: 0.72rem; font-family: var(--font-display); font-weight: 600; letter-spacing: 0.04em; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 8px; }

/* tappable words (clue + error modes) */
.tapline { font-size: 1.12rem; line-height: 2.1; }
.tok { background: none; border: 0; padding: 2px 3px; margin: 0 -1px; border-radius: 6px; font-size: inherit; line-height: 1.4; }
.tok:hover { background: var(--accent-soft); }
.tok.hit { background: var(--mark); color: var(--mark-ink); font-weight: 600; }
.tok.miss { background: var(--bad-soft); color: var(--bad); }
.tok.fine { color: var(--muted); text-decoration: underline dotted; }
.tok.badword { background: var(--bad-soft); color: var(--bad); text-decoration: line-through; font-weight: 600; }
.tok:disabled { cursor: default; }
.fixed { font-size: 1.02rem; }
.fixed ins { text-decoration: none; background: var(--ok-soft); color: var(--ok); font-weight: 600; padding: 0 3px; border-radius: 4px; }

/* sort mode */
.bigword { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; text-align: center; padding: 18px 0 6px; overflow-wrap: anywhere; }
.buckets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bucket { min-height: 64px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; }
.bucket b { font-family: var(--font-display); font-size: 1.1rem; }
.bucket small { color: var(--muted); font-size: 0.8rem; }
.bucket.right { border-color: var(--ok); background: var(--ok-soft); }
.bucket.wrong { border-color: var(--bad); background: var(--bad-soft); }
.combo { font-family: var(--font-display); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* flashcards */
.flash {
  width: 100%; min-height: 220px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px 18px; text-align: center;
}
.flash .front { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; }
.flash .answer { font-size: 1.25rem; font-weight: 600; color: var(--accent); }
.flash .exs { color: var(--muted); font-size: 0.95rem; }
.flash .hint { font-size: 0.82rem; color: var(--muted); }

/* decision steps */
.path { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.path li { font-size: 0.9rem; display: flex; gap: 8px; align-items: baseline; }
.path li .q { color: var(--muted); }
.path li .a { font-weight: 600; color: var(--ok); white-space: nowrap; }
.step { display: flex; flex-direction: column; gap: 10px; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.opts button { flex: 1 1 100px; min-height: 52px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); font-weight: 600; }
.opts button.wrong { border-color: var(--bad); background: var(--bad-soft); }

/* timer */
.timer { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--ok); width: 100%; }
.timer.low i { background: var(--bad); }

/* result */
.score { font-family: var(--font-display); font-size: 3rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 1.2rem; color: var(--muted); font-weight: 500; }
.misslist { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.misslist li { font-size: 0.92rem; border-left: 3px solid var(--bad); padding: 4px 0 4px 10px; }
.misslist li b { color: var(--ok); }
.cheat h3 { display: flex; gap: 8px; align-items: center; }

/* mock exam */
.mockcta {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 0;
  background: var(--accent); color: var(--surface); border-radius: var(--radius); padding: 16px 18px;
}
.mockcta:active { transform: scale(0.99); }
.mockcta .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.mockcta strong { font-family: var(--font-display); font-size: 1.15rem; }
.mockcta .t span { font-size: 0.88rem; opacity: 0.85; }
.mockcta .go { font-family: var(--font-display); font-size: 1.8rem; line-height: 1; }
.mockbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: -10px; }
.clock { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.clock.low { color: var(--bad); }
.choice.picked { border-color: var(--accent); background: var(--accent-soft); }
.choice.picked .bubble { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.sheethead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.sheetgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
@media (min-width: 520px) { .sheetgrid { grid-template-columns: repeat(10, 1fr); } }
.sheetgrid button {
  min-height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg);
  font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted);
}
.sheetgrid button.filled { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent); }
.sheetgrid button.cur { border-color: var(--accent); color: var(--ink); }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.hist li { display: grid; grid-template-columns: 4em 1fr auto; gap: 10px; font-variant-numeric: tabular-nums; }
.breakdown { display: flex; flex-direction: column; gap: 8px; }
.brow { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 0.95rem; }
.brow .meter { width: 96px; }
.seg { display: flex; border: 1.5px solid var(--accent); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 6px 12px; min-height: 38px; font-size: 0.88rem; font-weight: 600; color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.revlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.rev { border-left: 3px solid var(--bad); padding-left: 10px; }
.rev.ok { border-left-color: var(--ok); }
.rev summary { cursor: pointer; line-height: 1.7; }
.rev .qno { margin-right: 2px; }
.revbody { display: flex; flex-direction: column; gap: 6px; padding: 8px 0 4px; font-size: 0.93rem; }
.revbody .good { color: var(--ok); font-weight: 600; }
.revbody .bad { color: var(--bad); font-weight: 600; }
.revbody b { font-weight: 600; }
.sharebox { display: flex; flex-direction: column; gap: 6px; align-items: stretch; text-align: center; font-size: 0.85rem; }
.meter.wide { width: auto; flex: 1; }
.hist li .meter.wide { align-items: stretch; }
.foot { font-size: 0.8rem; color: var(--muted); text-align: center; }
/* login gate */
.gate { min-height: 75vh; display: flex; align-items: center; justify-content: center; }
.gate .panel { width: 100%; max-width: 380px; align-items: center; text-align: center; gap: 16px; padding: 28px 22px; }
.gate .heart { width: 44px; height: 44px; color: var(--bad); }
.gate form { width: 100%; display: flex; flex-direction: column; gap: 12px; }
.gate input.code {
  width: 100%; min-height: 60px; font-family: var(--font-display); font-size: 1.8rem; font-weight: 600;
  letter-spacing: 0.5em; text-indent: 0.5em; text-align: center; font-variant-numeric: tabular-nums;
  padding: 10px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink);
}
.gate input.code::placeholder { color: var(--line); }
.gate input.code:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
.gate .msg { min-height: 1.4em; font-size: 0.92rem; color: var(--bad); }
.gate .msg.ok { color: var(--ok); }
.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 0.8rem; padding: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; animation: none !important; } }
</style>

<script>
/* =================== CONTENT =================== */
const TOPICS = [
{
  id: "adjadv", name: "形容詞 vs 副詞", short: "形副", sub: "看空格修飾誰",
  rules: [
    ["空格修飾<em>名詞</em> → 形容詞", "a <u>careful</u> review"],
    ["空格修飾<em>動詞、形容詞、副詞、整句</em> → 副詞", "review it <u>carefully</u> / <u>extremely</u> busy"],
    ["空格在<em>連綴動詞</em>後（be, remain, seem, become, look, stay, appear）→ 形容詞", "Prices remained <u>stable</u>."],
    ["空格夾在 <em>be / have + ___ + p.p.</em> 中間 → 副詞", "has been <u>significantly</u> improved"]
  ],
  tip: "<strong>陷阱：</strong>-ly 結尾不一定是副詞。friendly、timely、costly、likely、orderly 都是形容詞；hard / hardly、late / lately 意思完全不同（hardly = 幾乎不）。",
  qs: [
    { s: "The new software allows employees to process orders more ------- than before.", o: ["efficient","efficiently","efficiency","efficiencies"], a: 1,
      why: "空格修飾動詞 <b>process</b>，要用副詞。more ___ than 只是比較級的外框，詞性還是看它修飾誰。", zh: "新軟體讓員工處理訂單比以前更有效率。" },
    { s: "Sales figures have remained ------- despite the economic downturn.", o: ["stable","stably","stability","stabilize"], a: 0,
      why: "<b>remain</b> 是連綴動詞，後面接形容詞描述主詞狀態。", zh: "儘管經濟衰退，銷售數字仍保持穩定。" },
    { s: "The proposal was ------- reviewed by the finance committee.", o: ["thorough","thoroughly","thoroughness","more thorough"], a: 1,

  { s: "Our ------- with the supplier has lasted more than ten years.", o: ["relate","relative","relationship","relatively"], a: 2,
    why: "所有格 <b>Our</b> 後面要名詞。relative 是名詞時指「親戚」，語意不通；要選 <b>relationship</b>（關係）。", zh: "我們和這家供應商的合作關係已超過十年。" },
  { s: "The committee will ------- the proposals and select a winner next month.", o: ["evaluate","evaluation","evaluative","evaluator"], a: 0,
    why: "助動詞 <b>will</b> 後面接原形動詞，和後面的 select 並列。-ate 是動詞字尾。", zh: "委員會將評估提案，並在下個月選出優勝者。" },
  { s: "Mr. Hassan's ------- to detail makes him an excellent editor.", o: ["attend","attentive","attendant","attention"], a: 3,
    why: "所有格後要名詞，<b>attention to detail</b>（注重細節）是固定說法。attendant 是「服務員」（人），語意不對。", zh: "哈森先生注重細節，所以是很出色的編輯。" },
  { s: "Ms. Novak's ------- to the board was approved unanimously.", o: ["appoint","appointment","appointed","appointee"], a: 1,
    why: "所有格後要名詞，而且是「被通過」的事，選 <b>appointment</b>（任命）。appointee 是被任命的人，人不會「被通過」。", zh: "諾瓦克女士進入董事會的任命獲得一致通過。" },
  { s: "Several food ------- praised the restaurant's new menu.", o: ["critics","criticism","critical","criticize"], a: 0,
    why: "主詞是會「稱讚」的人，而且 Several 後面接複數名詞，選 <b>critics</b>（評論家）。", zh: "幾位美食評論家稱讚了這間餐廳的新菜單。" },
  { s: "The ------- of the two firms is expected to be completed by June.", o: ["merge","merging","merger","merged"], a: 2,
    why: "<b>The ___ of</b> 要名詞，<b>merger</b>（合併案）。", zh: "兩家公司的合併預計在六月前完成。" },
  { s: "Recent studies show that regular breaks can increase employee -------.", o: ["produce","productive","productively","productivity"], a: 3,
    why: "<b>increase</b> 後面要名詞當受詞，employee 在這裡當形容詞用，所以要 <b>productivity</b>（生產力）。", zh: "近期研究顯示，定時休息能提升員工生產力。" },
  { s: "The finance department will conduct an ------- of all travel expenses.", o: ["analyze","analysis","analyst","analytical"], a: 1,
    why: "<b>conduct an ___ of</b> 要「事」的名詞 <b>analysis</b>。analyst 是分析師（人），不能被 conduct。", zh: "財務部將對所有差旅費用進行分析。" },
  { s: "One of our ------- will contact you within 24 hours.", o: ["consult","consultation","consultants","consultative"], a: 2,
    why: "<b>One of our + 複數名詞</b>，而且要能「聯絡你」，是人，選 <b>consultants</b>（顧問）。", zh: "我們的一位顧問將在 24 小時內與您聯絡。" },
  { s: "The project required a ------- amount of time and money.", o: ["considerate","considerable","consideration","considerably"], a: 1,
    why: "修飾名詞 amount 要形容詞。<b>considerable</b> = 相當大的；considerate = 體貼的，兩個都是形容詞，要看語意。", zh: "這個專案需要相當多的時間和金錢。" },
  { s: "Please be ------- of other passengers and keep your voice down.", o: ["considerate","considerable","consideration","considerably"], a: 0,
    why: "be 後面接形容詞，這裡說「體諒其他乘客」，用 <b>considerate</b>。和上一題 considerable 成對記。", zh: "請體諒其他乘客，降低說話音量。" },
  { s: "The company provides ------- training to all new employees.", o: ["comprehend","comprehension","comprehensible","comprehensive"], a: 3,
    why: "修飾名詞 training 要形容詞。<b>comprehensive</b> = 全面的；comprehensible = 可理解的。", zh: "公司為所有新進員工提供完整的訓練。" },
  { s: "The candidates will be interviewed by their ------- department heads.", o: ["respectful","respectable","respective","respectively"], a: 2,
    why: "修飾名詞要形容詞，三個 -ful / -able / -ive 意思都不同：<b>respective</b> = 各自的；respectful = 恭敬的；respectable = 體面的。", zh: "應徵者將分別由各自部門的主管面試。" }
],
ving: [
  { s: "Ms. Yamada suggested ------- the meeting to Thursday afternoon.", o: ["move","to move","moving","moved"], a: 2,
    why: "<b>suggest</b> 後面接 V-ing（或 suggest that S + 原形），不接 to V。", zh: "山田女士建議把會議移到週四下午。" },
  { s: "The company cannot afford ------- any more delays on the project.", o: ["to have","have","having","had"], a: 0,
    why: "<b>afford</b> 後面接 to V。", zh: "公司承擔不起專案再有任何延誤。" },
  { s: "Mr. Brown is accustomed to ------- long hours during the busy season.", o: ["work","worked","working","works"], a: 2,
    why: "<b>be accustomed to</b>（習慣於）的 to 是介系詞，接 V-ing。和 be used to 同一類。", zh: "布朗先生習慣在旺季長時間工作。" },
  { s: "We would like to thank you for ------- part in our customer survey.", o: ["take","to take","taken","taking"], a: 3,
    why: "介系詞 <b>for</b> 後面接 V-ing。", zh: "感謝您參與我們的顧客調查。" },
  { s: "The manager let the employees ------- home early before the holiday.", o: ["go","going","to go","gone"], a: 0,
    why: "使役動詞 <b>let + 人 + 原形</b>。", zh: "經理讓員工在假期前提早回家。" },
  { s: "Please avoid ------- personal items in the conference room overnight.", o: ["leave","to leave","leaving","left"], a: 2,
    why: "<b>avoid</b> 後面固定接 V-ing。", zh: "請避免把個人物品留在會議室過夜。" },
  { s: "Despite the staff shortage, the team managed ------- the project ahead of schedule.", o: ["to complete","complete","completing","completed"], a: 0,
    why: "<b>manage to V</b> = 設法做到。", zh: "儘管人手不足，團隊還是設法提前完成了專案。" },
  { s: "In addition to ------- a competitive salary, the company offers flexible working hours.", o: ["provide","provided","providing","provision"], a: 2,
    why: "<b>in addition to</b> 的 to 是介系詞，後面又有受詞 a competitive salary，要動名詞 <b>providing</b>。", zh: "除了提供有競爭力的薪資，公司也提供彈性工時。" },
  { s: "Prior to ------- the laboratory, all visitors must put on protective glasses.", o: ["enter","entrance","entered","entering"], a: 3,
    why: "<b>prior to</b>（= before）的 to 是介系詞。後面有受詞 the laboratory，所以用 <b>entering</b>，名詞 entrance 不能直接帶受詞。", zh: "進入實驗室前，所有訪客都必須戴上護目鏡。" },
  { s: "The director agreed ------- the budget for the advertising campaign.", o: ["increase","increasing","to increase","increased"], a: 2,
    why: "<b>agree</b> 後面接 to V。", zh: "主管同意增加廣告活動的預算。" },
  { s: "Many employees have difficulty ------- work and family responsibilities.", o: ["balancing","balance","to balance","balanced"], a: 0,
    why: "<b>have difficulty (in) + V-ing</b> = 做…有困難。同類：have trouble V-ing、spend time V-ing。", zh: "許多員工很難兼顧工作和家庭責任。" },
  { s: "The new system will help employees ------- their working hours more accurately.", o: ["tracking","tracked","track","tracks"], a: 2,
    why: "<b>help + 人 + (to) 原形</b>。選項沒有 to track，所以選原形 <b>track</b>。", zh: "新系統能幫助員工更準確地記錄工時。" },
  { s: "The firm is dedicated to ------- high-quality service to every client.", o: ["deliver","delivered","delivery","delivering"], a: 3,
    why: "<b>be dedicated to</b> 的 to 是介系詞。後面有受詞 high-quality service，用 <b>delivering</b>。", zh: "這家公司致力於為每位客戶提供高品質服務。" },
  { s: "Ms. Ahmed is considering ------- a second store in the downtown area.", o: ["open","to open","opening","opened"], a: 2,
    why: "<b>consider</b> 後面固定接 V-ing。", zh: "艾哈邁德女士正在考慮在市中心開第二家店。" },
  { s: "Mr. Lopez objected to ------- the meeting without the regional managers.", o: ["holding","hold","held","be held"], a: 0,
    why: "<b>object to</b>（反對）的 to 是介系詞，接 V-ing。", zh: "羅培茲先生反對在區域經理缺席的情況下開會。" },
  { s: "The new regulations will make it easier for small businesses ------- loans.", o: ["obtain","obtaining","obtained","to obtain"], a: 3,
    why: "<b>make it + 形容詞 + for 人 + to V</b>，it 是虛受詞，真正的受詞是後面的 to V。", zh: "新法規將讓小企業更容易取得貸款。" },
  { s: "The supervisor would rather ------- the problem in person than by e-mail.", o: ["discuss","discussing","to discuss","discussed"], a: 0,
    why: "<b>would rather + 原形</b> = 寧願。和 had better、would like to 一樣要分清楚後面接什麼。", zh: "主管寧願當面討論這個問題，而不是透過電子郵件。" },
  { s: "Despite the snowstorm, the shop kept ------- customers throughout the day.", o: ["serve","to serve","served","serving"], a: 3,
    why: "<b>keep + V-ing</b> = 持續做…。", zh: "儘管下大雪，這家店整天都持續接待客人。" },
  { s: "The CEO is expected ------- the merger at tomorrow's press conference.", o: ["announce","to announce","announcing","announced"], a: 1,
    why: "<b>be expected to V</b> = 預計會…。同類：be required to、be scheduled to、be supposed to。", zh: "執行長預計在明天的記者會上宣布合併案。" },
  { s: "When it comes to ------- new clients, personal referrals are the most effective.", o: ["attract","attracting","attracted","attraction"], a: 1,
    why: "<b>when it comes to</b> 的 to 是介系詞，接 V-ing。後面有受詞 new clients，所以不能用名詞 attraction。", zh: "說到吸引新客戶，親友介紹是最有效的。" }
],
relative: [
  { s: "The employee ------- designed the new logo will receive an award.", o: ["whom","whose","who","which"], a: 2,
    why: "後面 <b>designed the new logo</b> 缺主詞，先行詞是人，用 <b>who</b>。", zh: "設計新標誌的員工將獲頒獎項。" },
  { s: "The candidate ------- we interviewed yesterday has accepted another offer.", o: ["whose","whom","where","what"], a: 1,
    why: "<b>we interviewed</b> 缺受詞，先行詞是人，用受格 <b>whom</b>。", zh: "我們昨天面試的那位應徵者已經接受了別家的錄取。" },
  { s: "Mr. Kato returned to the city ------- he had worked as a young engineer.", o: ["which","when","whose","where"], a: 3,
    why: "<b>he had worked as a young engineer</b> 是完整句（work 不需要受詞），先行詞是地點，用 <b>where</b>。", zh: "加藤先生回到他年輕時當工程師的那座城市。" },
  { s: "The company, ------- headquarters are in Singapore, has opened a new branch in Taipei.", o: ["which","its","whose","that"], a: 2,
    why: "空格後直接接名詞 <b>headquarters</b>，「公司的總部」用 <b>whose</b>。its 不能連接兩個子句。", zh: "這家總部設在新加坡的公司在台北開了新分公司。" },
  { s: "December is the month ------- most retailers earn the largest share of their annual revenue.", o: ["when","which","where","what"], a: 0,
    why: "後面子句完整（earn 已有受詞 the largest share），先行詞是時間，用 <b>when</b>。", zh: "十二月是大多數零售商一年中營收最多的月份。" },
  { s: "The report ------- you requested is attached to this e-mail.", o: ["where","what","whose","which"], a: 3,
    why: "<b>you requested</b> 缺受詞（要求了什麼？），先行詞是物，用 <b>which</b>。", zh: "您要的報告附在這封電子郵件裡。" },
  { s: "The reason ------- the event was postponed has not been announced.", o: ["why","which","what","whose"], a: 0,
    why: "後面子句完整，先行詞是 <b>the reason</b>，用 <b>why</b>。", zh: "活動延期的原因尚未公布。" },
  { s: "Ms. Park, ------- has worked here for twenty years, will retire next month.", o: ["that","whom","who","whose"], a: 2,
    why: "後面缺主詞，先行詞是人，用 who。逗號後面不能用 that，所以選 <b>who</b>。", zh: "已經在這裡工作二十年的朴女士下個月要退休了。" },
  { s: "------- was discussed at the meeting will be summarized in the minutes.", o: ["That","Which","Whose","What"], a: 3,
    why: "前面沒有先行詞，<b>___ was discussed at the meeting</b> 整段當主詞，用 <b>What</b>（= the thing that）。", zh: "會議中討論的內容將整理在會議紀錄裡。" },
  { s: "The conference room in ------- the interviews will take place is on the third floor.", o: ["that","which","where","whom"], a: 1,
    why: "介系詞 <b>in</b> 後面接 which（物）或 whom（人）。in that、in where 都不成立。<b>in which</b> = where。", zh: "舉行面試的會議室在三樓。" },
  { s: "Applicants ------- experience includes international sales are encouraged to apply.", o: ["whose","who","whom","which"], a: 0,
    why: "空格後直接接名詞 <b>experience</b>，「應徵者的經驗」用所有格 <b>whose</b>。", zh: "具有國際業務經驗的應徵者歡迎應徵。" },
  { s: "The supplier with ------- we have worked for years has raised its prices.", o: ["who","that","whose","whom"], a: 3,
    why: "介系詞 <b>with</b> 後面指人要用 <b>whom</b>，不能用 who 或 that。", zh: "和我們合作多年的供應商調漲了價格。" },
  { s: "This is the factory ------- produces most of the company's electronic components.", o: ["where","which","whose","what"], a: 1,
    why: "<b>陷阱題：</b>先行詞是地點，但後面 <b>produces…</b> 缺主詞，所以用 <b>which</b>。where 後面要接完整句。", zh: "這就是生產公司大部分電子零件的工廠。" },
  { s: "Please return the form to the office ------- you received it.", o: ["which","where","what","whose"], a: 1,
    why: "<b>you received it</b> 是完整句（受詞 it 已經在），先行詞是地點，用 <b>where</b>。和上一題對照看。", zh: "請把表格交回你領取的那個辦公室。" },
  { s: "The week ------- the new store opened was the busiest of the year.", o: ["which","where","when","whose"], a: 2,
    why: "<b>the new store opened</b> 是完整句（open 在這裡不及物），先行詞是時間，用 <b>when</b>。", zh: "新店開幕的那週是一年中最忙的一週。" },
  { s: "Most of the staff, many of ------- live in the suburbs, commute by train.", o: ["them","who","whom","which"], a: 2,
    why: "<b>many of ___</b>：介系詞 of 後面指人用 <b>whom</b>。them 會讓句子有兩個動詞卻沒有連接詞。", zh: "大部分員工都搭火車通勤，其中很多人住在郊區。" },
  { s: "The new manager has introduced several changes, ------- have improved efficiency.", o: ["that","it","what","which"], a: 3,
    why: "逗號後面、缺主詞、先行詞是物，用 <b>which</b>。逗號後不能用 that。", zh: "新經理推動了幾項改變，這些改變提升了效率。" },
  { s: "Anyone ------- wishes to attend the workshop should sign up by Friday.", o: ["who","whom","whose","whoever"], a: 0,
    why: "先行詞 <b>Anyone</b> 是人，後面缺主詞，用 <b>who</b>。whoever 本身已含「任何人」，前面不能再有 anyone。", zh: "任何想參加工作坊的人都應在週五前報名。" },
  { s: "The training manual explains ------- new employees should do on their first day.", o: ["that","which","what","where"], a: 2,
    why: "前面沒有先行詞，<b>should do</b> 缺受詞，用 <b>what</b>（= the things that）。", zh: "訓練手冊說明了新進員工第一天該做的事。" },
  { s: "Mr. Chen is the consultant ------- advice helped us reduce costs.", o: ["who","whose","whom","that"], a: 1,
    why: "空格後直接接名詞 <b>advice</b>，「顧問的建議」用 <b>whose</b>。", zh: "陳先生就是那位以建議幫我們降低成本的顧問。" }
],
prep: [
  { s: "------- completion of the training, participants will receive a certificate.", o: ["Since","While","Although","Upon"], a: 3,
    why: "<b>Upon + 名詞</b> = 一…就…。While、Although 是連接詞，後面要接子句。", zh: "完成訓練後，學員將獲得證書。" },
  { s: "The store will remain open ------- 10 P.M. during the holiday season.", o: ["by","within","until","since"], a: 2,
    why: "<b>remain open</b> 是持續的狀態，用 <b>until</b>（一直到）。by 用在一次性動作的截止時間。", zh: "假期期間，商店將營業到晚上十點。" },
  { s: "The museum will be closed to the public ------- the renovation.", o: ["while","during","since","among"], a: 1,
    why: "後面是名詞 the renovation，用介系詞 <b>during</b>。while 是連接詞，要接子句。", zh: "博物館整修期間不對外開放。" },
  { s: "------- the project was over budget, the client was satisfied with the results.", o: ["Despite","In spite of","Although","Because of"], a: 2,
    why: "後面是子句（the project was…），要連接詞 <b>Although</b>。Despite、In spite of、Because of 都是介系詞。", zh: "雖然專案超出預算，客戶仍對成果感到滿意。" },
  { s: "------- the absence of the director, Ms. Lin will chair the meeting.", o: ["On","In","At","By"], a: 1,
    why: "<b>in the absence of</b> = 在…不在的時候，固定說法。", zh: "主任不在時，由林女士主持會議。" },
  { s: "The package should arrive ------- three business days.", o: ["by","until","since","within"], a: 3,
    why: "<b>within + 一段期間</b> = 在…之內。by 後面接時間點。", zh: "包裹應在三個工作天內送達。" },
  { s: "Mr. Grant has worked for the company ------- 2015.", o: ["for","since","during","from"], a: 1,
    why: "現在完成式 + 過去的時間點，用 <b>since</b>。for 接一段時間（for ten years）；from 要和 to 連用。", zh: "格蘭特先生從 2015 年起就在這家公司工作。" },
  { s: "Full-time employees are eligible for the bonus ------- their position.", o: ["in spite","even though","whereas","regardless of"], a: 3,
    why: "<b>regardless of + 名詞</b> = 不論…。in spite 少了 of；even though、whereas 是連接詞。", zh: "全職員工不論職位都有資格領取獎金。" },
  { s: "------- receiving the shipment, please check all items for damage.", o: ["At","On","By","In"], a: 1,
    why: "<b>On + V-ing</b> = Upon + V-ing = 一…就…。", zh: "收到貨物時，請檢查所有品項是否有損壞。" },
  { s: "The seminar has been postponed ------- further notice.", o: ["by","within","until","since"], a: 2,
    why: "<b>until further notice</b> = 直到另行通知，固定說法。", zh: "研討會延期，日期另行通知。" },
  { s: "------- to the new policy, all visitors must wear a badge.", o: ["Regarding","According","Instead","Rather"], a: 1,
    why: "<b>according to</b> = 根據。regarding 本身就是介系詞，不加 to；instead 要接 of；rather 要接 than。", zh: "根據新規定，所有訪客都必須配戴識別證。" },
  { s: "------- the merger, the two companies operated independently.", o: ["Because","Prior to","Owing","Whereas"], a: 1,
    why: "後面是名詞 the merger，要介系詞。<b>prior to</b> = before。Because、Whereas 是連接詞；owing 要接 to。", zh: "合併之前，兩家公司各自獨立營運。" },
  { s: "Ms. Diaz will be in charge ------- the project while Mr. Wong is on leave.", o: ["for","with","of","on"], a: 2,
    why: "<b>in charge of</b> = 負責…，固定搭配。", zh: "黃先生休假期間，由迪亞茲女士負責這個專案。" },
  { s: "All prices listed in the catalog are subject ------- change without notice.", o: ["to","for","with","on"], a: 0,
    why: "<b>be subject to + 名詞</b> = 可能會…、須經…。這個 to 是介系詞，change 在這裡是名詞。", zh: "目錄上的價格可能隨時變動，恕不另行通知。" },
  { s: "------- of the entire staff, I would like to thank you for your support.", o: ["In case","Instead","In spite","On behalf"], a: 3,
    why: "<b>on behalf of</b> = 代表…，商業書信常見。", zh: "我謹代表全體員工感謝您的支持。" },
  { s: "The hotel provides a shuttle bus to the airport ------- request.", o: ["upon","at","of","under"], a: 0,

}

  const set = new Set(store._days || []); let n = 0; const d = new Date();
  if (!set.has(today(d))) d.setDate(d.getDate() - 1);
  while (set.has(today(d))) { n++; d.setDate(d.getDate() - 1); }

}

    return `<div class="mockbar"><button class="back" id="back">‹ 離開</button><span class="clock" id="clock" aria-label="剩餘時間"></span></div>
      <div class="timer" id="timer"><i></i></div>`;
  }
  function sheet() {
    return `<section class="panel sheet"><div class="sheethead"><h3>答案卡</h3><span class="muted">已答 ${answered()} / ${n}</span></div>
      <div class="sheetgrid">${list.map((_, k) => `<button data-j="${k}" class="${ans[k] >= 0 ? "filled" : ""}${k === i ? " cur" : ""}" aria-label="第 ${k + 1} 題${ans[k] >= 0 ? "，已作答" : ""}">${k + 1}</button>`).join("")}</div></section>`;
  }
  function bindCommon() {
    app.querySelector("#back").onclick = () => { if (confirm("離開就會放棄這次模擬考，確定嗎？")) home(); };
    app.querySelectorAll(".sheetgrid button").forEach(b => b.onclick = () => { i = +b.dataset.j; render(); });
  }
  function render() {
    clearTimeout(advance);
    const { q } = list[i];
    paint(`${topbar()}
      <article class="qcard">
        <div class="qmeta"><span class="qno">第 ${i + 1} 題 / ${n}</span></div>
        <p class="sentence">${sentenceHTML(q.s)}</p>
        <div class="choices">
          ${q.o.map((o, k) => `<button class="choice${ans[i] === k ? " picked" : ""}" data-k="${k}" aria-pressed="${ans[i] === k}"><span class="bubble">${L[k]}</span><span>${esc(o)}</span></button>`).join("")}
        </div>
      </article>
      <div class="actions">
        <button class="btn ghost grow" id="prev" ${i ? "" : "disabled"}>上一題</button>
        <button class="btn grow" id="next">${i + 1 < n ? "下一題" : "交卷"}</button>
      </div>
      ${sheet()}`);
    bindCommon();
    app.querySelectorAll(".choice").forEach(b => b.onclick = () => {
      ans[i] = +b.dataset.k;
      app.querySelectorAll(".choice").forEach(x => { const on = +x.dataset.k === ans[i]; x.classList.toggle("picked", on); x.setAttribute("aria-pressed", on); });
      if (i + 1 < n) advance = setTimeout(() => { i++; render(); }, 280);
      app.querySelectorAll(".sheetgrid button")[i].classList.add("filled");
    });
    app.querySelector("#prev").onclick = () => { if (i) { i--; render(); } };
    app.querySelector("#next").onclick = () => { if (i + 1 < n) { i++; render(); } else check(); };
  }
  function check() {
    clearTimeout(advance);
    const blank = n - answered();
    if (!blank) { finish(false); return; }
    i = ans.indexOf(-1);
    paint(`${topbar()}
      <section class="panel"><h3>還有 ${blank} 題沒作答</h3>
        <p class="muted">答案卡上空白的就是還沒寫的。正式考試答錯不倒扣，沒把握也要猜一個。</p></section>
      <div class="actions"><button class="btn grow" id="resume">回去作答</button><button class="btn ghost grow" id="submit">直接交卷</button></div>
      ${sheet()}`);
    bindCommon();
    app.querySelector("#resume").onclick = render;
    app.querySelector("#submit").onclick = () => finish(false);
  }
  function finish(timeUp) {
    if (done) return; done = true; stop(); cleanup = null;
    const secs = Math.min((Date.now() - start) / 1000, MOCK_SECS);
    let score = 0;
    list.forEach((x, k) => { const ok = ans[k] === x.q.a; if (ok) score++; record(x.id, ok); });
    (store._mocks = store._mocks || []).push({ d: today(), score, n, secs: Math.round(secs) });
    store._mocks = store._mocks.slice(-30); save();
    mockResult(list, ans, score, secs, timeUp);
  }
  render();
}
function mockResult(list, ans, score, secs, timeUp) {
  const n = list.length;
  const by = TOPICS.map(t => { const xs = list.map((x, k) => ({ x, k })).filter(o => o.x.t === t); return { t, ok: xs.filter(o => ans[o.k] === o.x.q.a).length, n: xs.length }; });
  const weak = by.filter(b => b.ok < b.n).sort((a, b) => a.ok / a.n - b.ok / b.n)[0];
  const item = (x, k) => {
    const a = ans[k], ok = a === x.q.a;
    return `<li class="rev ${ok ? "ok" : "no"}" data-ok="${ok}">
      <details ${ok ? "" : "open"}>
        <summary><span class="qno">${k + 1}.</span> ${sentenceHTML(x.q.s, x.q.o[x.q.a])}</summary>
        <div class="revbody">
          <p>${a < 0 ? `<span class="bad">沒作答</span>` : ok ? `<span class="good">答對 (${L[a]}) ${esc(x.q.o[a])}</span>` : `你選 <span class="bad">(${L[a]}) ${esc(x.q.o[a])}</span>，正解 <span class="good">(${L[x.q.a]}) ${esc(x.q.o[x.q.a])}</span>`} <span class="tag">${x.t.name}</span></p>
          <p>${x.q.why}</p><p class="muted">${x.q.zh}</p>
        </div>
      </details></li>`;
  };
  screen(`
    <header class="top"><span class="eyebrow">模擬考 · 結果</span><h2>${timeUp ? "時間到，已自動交卷" : score === n ? "全對，準備好了！" : "交卷完成"}</h2></header>
    <section class="panel">
      <div class="score">${score}<small> / ${n}</small></div>
      <p class="muted">用時 ${fmt(secs)}（限時 10:00），平均每題 ${(secs / n).toFixed(1)} 秒。</p>
      <div class="breakdown">${by.map(b => `<div class="brow"><span>${b.t.name}</span><span class="meter"><span>${b.ok}/${b.n}</span><i style="--p:${Math.round(b.ok / b.n * 100)}%"></i></span></div>`).join("")}</div>
      ${weak ? `<p class="tip"><strong>最需要加強：</strong>${weak.t.name}。可以先回單元看重點，再練錯題本。</p>` : ""}
    </section>
    <section class="panel">
      <div class="sheethead"><h3>詳解</h3>
        <div class="seg" role="group" aria-label="篩選"><button data-f="no" aria-pressed="true">錯題 ${n - score}</button><button data-f="all" aria-pressed="false">全部 ${n}</button></div></div>
      <ul class="revlist">${list.map(item).join("")}</ul>
      <p class="muted" id="none" ${score === n ? "" : "hidden"}>這回沒有錯題。</p>
    </section>
    <div class="actions"><button class="btn grow" id="again">再考一回</button><button class="btn ghost grow" id="share">傳送這次成績</button><button class="btn ghost grow" id="home">回首頁</button></div>`);
  app.querySelector("#share").onclick = e => shareProgress(e.currentTarget);
  const seg = app.querySelectorAll(".seg button");
  const filter = f => {
    seg.forEach(b => b.setAttribute("aria-pressed", b.dataset.f === f));
    app.querySelectorAll(".rev").forEach(li => li.hidden = f === "no" && li.dataset.ok === "true");
    app.querySelector("#none").hidden = !(f === "no" && score === n);
  };
  seg.forEach(b => b.onclick = () => filter(b.dataset.f));
  filter("no");
  app.querySelector("#again").onclick = mockIntro;
  app.querySelector("#home").onclick = home;
}

/* =================== PROGRESS REPORT (shared by link) =================== */
/* 進度整包放在網址的 # 後面：不會送到任何伺服器，收到連結的人打開就能看 */
function buildReport() {
  const all = allQs();
  let n = 0, wrong = 0;
  all.forEach(x => { const r = store[x.id]; if (r) { n += r.n; wrong += r.wrong; } });
  return {
    v: 1, t: Date.now(), s: streak(), d: (store._days || []).length, n, c: n - wrong,
    m: (store._mocks || []).slice(-10).map(m => [m.d, m.score, m.n, m.secs]),
    u: TOPICS.map(t => { const xs = topicQs(t); return [t.id, xs.filter(x => store[x.id] && store[x.id].last).length, xs.filter(x => store[x.id]).length]; }),
    w: missed().sort((a, b) => store[b.id].wrong - store[a.id].wrong).slice(0, 12).map(x => [x.id, store[x.id].wrong])
  };
}
function encodeReport(r) { return btoa(unescape(encodeURIComponent(JSON.stringify(r)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function decodeReport(s) {
  try { return JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))))); } catch (e) { return null; }
}
function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
function summaryText(r) {
  const last = r.m[r.m.length - 1];
  return `多益練習進度：連續 ${r.s} 天，總共作答 ${r.n} 次（正確率 ${pct(r.c, r.n)}%）` +
    (last ? `，模擬考上次 ${last[1]}/${last[2]}` : "") + `，錯題本 ${missed().length} 題。`;
}
async function shareProgress(btn) {
  const r = buildReport();
  const url = location.origin + location.pathname + "#r=" + encodeReport(r);
  const text = summaryText(r);
  if (navigator.share) {
    try { await navigator.share({ title: "多益練習進度", text, url }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try {
    await navigator.clipboard.writeText(text + "\n" + url);
    const old = btn.textContent; btn.textContent = "已複製，貼到 LINE 傳出去"; setTimeout(() => { btn.textContent = old; }, 2500);
  } catch (e) { window.prompt("複製這個連結傳出去：", url); }
}
function findQ(id) {
  const [tid, i] = id.split(":"); const t = TOPICS.find(x => x.id === tid);
  return t && t.qs[+i] ? { t, q: t.qs[+i] } : null;
}
function report(r) {
  const when = new Date(r.t);
  const stamp = `${when.getMonth() + 1}/${when.getDate()} ${String(when.getHours()).padStart(2, "0")}:${String(when.getMinutes()).padStart(2, "0")}`;
  const mocks = r.m.slice().reverse();
  const best = r.m.length ? Math.max(...r.m.map(m => m[1])) : 0;
  screen(`
    <header class="top">
      <span class="eyebrow">進度報告 · ${stamp} 傳出</span>
      <h2>多益 Part 5 練習進度</h2>
      <div class="stats">
        <span class="stat">連續練習 <b>${r.s}</b> 天</span>
        <span class="stat">共練了 <b>${r.d}</b> 天</span>
        <span class="stat">作答 <b>${r.n}</b> 次</span>
        <span class="stat">正確率 <b>${pct(r.c, r.n)}%</b></span>
      </div>
    </header>
    <section class="panel">
      <div class="sheethead"><h3>模擬考</h3>${r.m.length ? `<span class="muted">最高 ${best} / 30</span>` : ""}</div>
      ${mocks.length ? `<ul class="hist">${mocks.map(m => `<li><span class="muted">${m[0].slice(5).replace("-", "/")}</span>
        <span class="meter wide"><span><b>${m[1]}</b> / ${m[2]}</span><i style="--p:${pct(m[1], m[2])}%"></i></span>
        <span class="muted">${fmt(m[3])}</span></li>`).join("")}</ul>` : `<p class="muted">還沒考過模擬考。</p>`}
    </section>
    <section class="panel">
      <h3>各單元</h3>
      <div class="breakdown">${r.u.map(u => { const t = TOPICS.find(x => x.id === u[0]); if (!t) return ""; return `
        <div class="brow"><span>${t.name}<br><span class="muted" style="font-size:.8rem">做過 ${u[2]} / ${t.qs.length} 題</span></span>
        <span class="meter"><span>答對 ${u[1]}</span><i style="--p:${pct(u[1], t.qs.length)}%"></i></span></div>`; }).join("")}</div>
      <p class="muted" style="font-size:.85rem">「答對」是最近一次作答答對的題數，長條以單元總題數計算。</p>
    </section>
    <section class="panel">
      <h3>目前還會錯的題目</h3>
      ${r.w.length ? `<ul class="misslist">${r.w.map(([id, k]) => { const f = findQ(id); if (!f) return ""; return `<li>${sentenceHTML(f.q.s, f.q.o[f.q.a])}<br>
        <span class="muted">正解 <b>${esc(f.q.o[f.q.a])}</b> · ${f.t.name} · 錯過 ${k} 次</span></li>`; }).join("")}</ul>` : `<p class="muted">錯題本是空的，目前沒有還會錯的題目。</p>`}
    </section>
    <div class="actions"><button class="btn ghost grow" id="home">回首頁</button></div>`);
  app.querySelector("#home").onclick = () => { try { history.replaceState(null, "", location.pathname); } catch (e) {} home(); };
}
function start() {
  const m = location.hash.match(/^#r=([\w-]+)/);
  const r = m && decodeReport(m[1]);
  if (r && r.v === 1) report(r); else home();
}

/* =================== QUIZ (optionally timed) =================== */
function quiz(list, label, seconds) {
  let i = 0, score = 0, used = 0; const wrong = [];
  function render() {
    const { q, t, id } = list[i];
    screen(`
      ${head(label, i, list.length)}
      ${seconds ? `<div class="timer" id="timer"><i></i></div>` : ""}
      <article class="qcard">
        <div class="qmeta"><span class="qno">${label}</span>${label === t.name ? "" : `<span class="tag">${t.name}</span>`}</div>
        <p class="sentence" id="sent">${sentenceHTML(q.s)}</p>
        <div class="choices">
          ${q.o.map((o, k) => `<button class="choice" data-k="${k}"><span class="bubble">${L[k]}</span><span>${esc(o)}</span></button>`).join("")}
        </div>
        <div id="fb"></div>
      </article>
      <div class="actions"><button class="btn grow" id="next" hidden>${i + 1 < list.length ? "下一題" : "看結果"}</button></div>`);
    bindBack();
    const btns = app.querySelectorAll(".choice");
    const start = Date.now(); let timerId = null;
    function answer(k) {
      if (timerId) { clearInterval(timerId); timerId = null; }
      used += Math.min((Date.now() - start) / 1000, seconds || 999);
      const ok = k === q.a;
      record(id, ok);
      if (ok) score++; else wrong.push(list[i]);
      btns.forEach(x => {
        x.disabled = true;
        const kk = +x.dataset.k;
        if (kk === q.a) x.classList.add("right"); else if (kk === k) x.classList.add("wrong"); else x.classList.add("dim");
      });
      app.querySelector("#sent").innerHTML = sentenceHTML(q.s, q.o[q.a]);
      const verdict = k === -1 ? "時間到，正解是 (" + L[q.a] + ") " + esc(q.o[q.a]) : ok ? "答對了" : "答錯了，正解是 (" + L[q.a] + ") " + esc(q.o[q.a]);
      app.querySelector("#fb").innerHTML = `
        <div class="feedback ${ok ? "ok" : "no"}" role="status">
          <span class="verdict">${verdict}</span><p>${q.why}</p><p class="zh">${q.zh}</p>
        </div>`;
      const nx = app.querySelector("#next"); nx.hidden = false; nx.focus({ preventScroll: true });
      app.querySelector("#fb").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
    btns.forEach(b => b.onclick = () => answer(+b.dataset.k));
    if (seconds) {
      const bar = app.querySelector("#timer"), fill = bar.querySelector("i");
      timerId = setInterval(() => {
        const left = seconds - (Date.now() - start) / 1000;
        fill.style.width = Math.max(0, left / seconds * 100) + "%";
        bar.classList.toggle("low", left < 5);
        if (left <= 0) answer(-1);
      }, 100);
      cleanup = () => { if (timerId) clearInterval(timerId); };
    }
    app.querySelector("#next").onclick = () => { i++; i < list.length ? render() : result(); };
  }
  function result() {
    const avg = (used / list.length).toFixed(1);
    doneScreen(label, score === list.length ? "全對，很穩！" : "這回合完成",
      `<div class="score">${score}<small> / ${list.length}</small></div>
       ${seconds ? `<p class="muted">平均每題 ${avg} 秒。正式考試 Part 5 建議每題 20 秒內完成。</p>` : ""}
       ${wrong.length ? `<h3>要再看一次的題目</h3><ul class="misslist">${wrong.map(w => `<li>${sentenceHTML(w.q.s, w.q.o[w.q.a])}<br><span class="muted">正解 <b>${esc(w.q.o[w.q.a])}</b> · ${w.t.name}</span></li>`).join("")}</ul>` : `<p class="muted">這組題目都答對了。</p>`}`,
      wrong.length ? () => quiz(shuffle(wrong), label.replace("（重做）", "") + "（重做）", seconds) : null);
    if (wrong.length) app.querySelector("#again").textContent = "重做答錯的 " + wrong.length + " 題";
  }
  render();
}

/* =================== CLUE DETECTIVE =================== */
function clueMode() {
  const list = shuffle(CLUES); let i = 0, firstTry = 0;
  function render() {
    const it = list[i]; let misses = 0;
    screen(`
      ${head("線索偵探", i, list.length)}
      <article class="qcard">
        <div class="qmeta"><span class="qno">線索偵探</span><span class="tag">${topicName(it.t)}</span></div>
        <p class="prompt" id="prompt">第一步：點出「決定答案」的那個字</p>
        <p class="tapline" id="line">${tapHTML(it.s)}</p>
        <div id="fb"></div>
        <div class="choices" id="choices" hidden>
          ${it.o.map((o, k) => `<button class="choice" data-k="${k}"><span class="bubble">${L[k]}</span><span>${esc(o)}</span></button>`).join("")}
        </div>
        <div id="fb2"></div>
      </article>
      <div class="actions"><button class="btn grow" id="next" hidden>${i + 1 < list.length ? "下一題" : "看結果"}</button></div>`);
    bindBack();
    const toks = app.querySelectorAll(".tok");
    const isClue = w => it.clue.map(norm).includes(norm(w));
    toks.forEach(b => b.onclick = () => {
      if (isClue(b.textContent)) {
        toks.forEach(x => { x.disabled = true; x.classList.remove("miss"); if (isClue(x.textContent)) x.classList.add("hit"); });
        if (misses === 0) firstTry++;
        app.querySelector("#prompt").textContent = "第二步：根據線索選答案";
        app.querySelector("#fb").innerHTML = `<div class="feedback info"><span class="verdict">找到線索了</span><p>${it.says}</p></div>`;
        app.querySelector("#choices").hidden = false;
      } else {
        misses++;
        b.classList.add("miss");
        app.querySelector("#fb").innerHTML = `<div class="feedback no"><span class="verdict">不是這個字</span><p>想想看：空格跟哪個字有文法上的關係？通常就在空格前後。</p></div>`;
        if (misses >= 2) {
          toks.forEach(x => { if (isClue(x.textContent)) x.classList.add("hit"); });
          app.querySelector("#fb").innerHTML += `<p class="muted" style="font-size:.88rem;margin-top:6px">提示已標出，點它繼續。</p>`;
        }
      }
    });
    const btns = app.querySelectorAll(".choice");
    btns.forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === it.a; markDay();
      btns.forEach(x => { x.disabled = true; const kk = +x.dataset.k; if (kk === it.a) x.classList.add("right"); else if (kk === k) x.classList.add("wrong"); else x.classList.add("dim"); });
      app.querySelector("#line").innerHTML = sentenceHTML(it.s, it.o[it.a]);
      app.querySelector("#fb2").innerHTML = `<div class="feedback ${ok ? "ok" : "no"}"><span class="verdict">${ok ? "答對了" : "正解是 (" + L[it.a] + ") " + esc(it.o[it.a])}</span></div>`;
      const nx = app.querySelector("#next"); nx.hidden = false;
      app.querySelector("#fb2").scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
    app.querySelector("#next").onclick = () => { i++; i < list.length ? render() : doneScreen("線索偵探", "偵探任務完成",
      `<div class="score">${firstTry}<small> / ${list.length}</small></div><p class="muted">一次就找到線索的題數。考試時先找線索再看選項，速度會快很多。</p>`, clueMode); };
  }
  render();
}

/* =================== ERROR HUNT =================== */
function errorMode() {
  const list = shuffle(ERRORS).slice(0, 8); let i = 0, found = 0;
  function render() {
    const it = list[i]; let misses = 0;
    screen(`
      ${head("改錯挑戰", i, list.length)}
      <article class="qcard">
        <div class="qmeta"><span class="qno">改錯挑戰</span><span class="tag">${topicName(it.t)}</span></div>
        <p class="prompt">這句有一個地方錯了，點出來</p>
        <p class="tapline">${tapHTML(it.s)}</p>
        <div id="fb"></div>
      </article>
      <div class="actions"><button class="btn grow" id="next" hidden>${i + 1 < list.length ? "下一題" : "看結果"}</button></div>`);
    bindBack();
    const toks = app.querySelectorAll(".tok");
    const isBad = w => it.bad.includes(norm(w));
    function reveal(ok) {
      markDay();
      toks.forEach(x => { x.disabled = true; x.classList.remove("fine"); if (isBad(x.textContent)) x.classList.add("badword"); });
      const words = it.s.split(" "); let done = false;
      const fixed = words.map(w => {
        if (it.bad.includes(norm(w))) { if (done) return null; done = true; const tail = /[.,]$/.test(w) ? w.slice(-1) : ""; return `<ins>${esc(it.fix)}</ins>${tail}`; }
        return esc(w);
      }).filter(x => x !== null).join(" ");
      app.querySelector("#fb").innerHTML = `<div class="feedback ${ok ? "ok" : "no"}" role="status">
        <span class="verdict">${ok ? "抓到了" : "錯在這裡"}</span>
        <p class="fixed">${fixed}</p><p>${it.why}</p></div>`;
      app.querySelector("#next").hidden = false;
    }
    toks.forEach(b => b.onclick = () => {
      if (isBad(b.textContent)) { if (misses === 0) found++; reveal(true); }
      else {
        misses++; b.classList.add("fine"); b.disabled = true;
        if (misses >= 2) reveal(false);
        else app.querySelector("#fb").innerHTML = `<div class="feedback no"><span class="verdict">這個字沒問題</span><p>再找一次，還有一次機會。</p></div>`;
      }
    });
    app.querySelector("#next").onclick = () => { i++; i < list.length ? render() : doneScreen("改錯挑戰", "挑戰完成",
      `<div class="score">${found}<small> / ${list.length}</small></div><p class="muted">第一次就點中錯誤的題數。</p>`, errorMode); };
  }
  render();
}

/* =================== WORD SORT =================== */
function sortMode() {
  const list = shuffle(SORT).slice(0, 12); let i = 0, score = 0, combo = 0, best = 0; const miss = [];
  function render() {
    const [w, p, zh, note] = list[i];
    screen(`
      ${head("詞性分類", i, list.length)}
      <article class="qcard">
        <div class="qmeta"><span class="qno">這個字是什麼詞性？</span><span class="combo">連對 ${combo}</span></div>
        <div class="bigword">${w}</div>
        <div class="buckets">${Object.keys(POS).map(k => `<button class="bucket" data-p="${k}"><b>${POS[k][0]}</b><small>${POS[k][1]}</small></button>`).join("")}</div>
        <div id="fb"></div>
      </article>
      <div class="actions"><button class="btn grow" id="next" hidden>${i + 1 < list.length ? "下一個" : "看結果"}</button></div>`);
    bindBack();
    const bs = app.querySelectorAll(".bucket");
    bs.forEach(b => b.onclick = () => {
      const ok = b.dataset.p === p; markDay();
      if (ok) { score++; combo++; best = Math.max(best, combo); } else { combo = 0; miss.push(list[i]); }
      bs.forEach(x => { x.disabled = true; if (x.dataset.p === p) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); });
      app.querySelector("#fb").innerHTML = `<div class="feedback ${ok ? "ok" : "no"}"><span class="verdict">${ok ? "答對了" : "是" + POS[p][1]}</span><p><b>${w}</b>（${POS[p][0]}）${zh}</p><p class="zh">${note}</p></div>`;
      app.querySelector("#next").hidden = false;
    });
    app.querySelector("#next").onclick = () => { i++; i < list.length ? render() : doneScreen("詞性分類", "分類完成",
      `<div class="score">${score}<small> / ${list.length}</small></div><p class="muted">最高連對 ${best} 個。</p>
       ${miss.length ? `<h3>要記住的字</h3><ul class="misslist">${miss.map(m => `<li><b>${m[0]}</b> ${POS[m[1]][0]} ${m[2]}<br><span class="muted">${m[3]}</span></li>`).join("")}</ul>` : ""}`, sortMode); };
  }
  render();
}

/* =================== FLASHCARDS =================== */
function cardMode() {
  let queue = shuffle(CARDS); const total = queue.length; let known = 0, again = 0;
  function render() {
    const c = queue[0]; let flipped = false;
    screen(`
      ${head("搭配閃卡", known, total)}
      <button class="flash" id="card" aria-live="polite">
        <span class="tag">${topicName(c[3])}</span>
        <span class="front">${esc(c[0])}</span>
        <span class="hint" id="hint">先在心裡想答案，再點卡片翻面</span>
        <span class="answer" id="ans" hidden>${esc(c[1])}</span>
        <span class="exs" id="exs" hidden>${esc(c[2])}</span>
      </button>
      <div class="actions" id="rate" hidden>
        <button class="btn ghost grow" id="no">還不熟</button>
        <button class="btn grow" id="yes">記住了</button>
      </div>
      <p class="foot">剩 ${queue.length} 張。點「還不熟」的卡片會排到後面再出現。</p>`);
    bindBack();
    app.querySelector("#card").onclick = () => {
      if (flipped) return; flipped = true;
      app.querySelector("#ans").hidden = false; app.querySelector("#exs").hidden = false; app.querySelector("#hint").hidden = true;
      app.querySelector("#rate").hidden = false;
    };
    app.querySelector("#yes").onclick = () => { markDay(); queue.shift(); known++; queue.length ? render() : finish(); };
    app.querySelector("#no").onclick = () => { markDay(); again++; const x = queue.shift(); queue.splice(Math.min(3, queue.length), 0, x); render(); };
  }
  function finish() {
    doneScreen("搭配閃卡", "整疊卡片都記住了", `<div class="score">${total}<small> 張</small></div><p class="muted">過程中點了 ${again} 次「還不熟」。</p>`, cardMode);
  }
  render();
}

/* =================== RELATIVE DECISION TREE =================== */
function treeMode() {
  const list = shuffle(TREE); let i = 0, clean = 0;
  function render() {
    const it = list[i]; let node = "ante"; let slips = 0; const path = [];
    screen(`
      ${head("關係詞判斷流程", i, list.length)}
      <article class="qcard">
        <div class="qmeta"><span class="qno">關係詞判斷流程</span><span class="tag">關係詞</span></div>
        <p class="sentence" id="sent">${sentenceHTML(it.s)}</p>
        <ul class="path" id="path"></ul>
        <div class="step" id="step"></div>
        <div id="fb"></div>
      </article>
      <div class="actions"><button class="btn grow" id="next" hidden>${i + 1 < list.length ? "下一句" : "看結果"}</button></div>`);
    bindBack();
    function correctNext(n) {
      // walk from node n to find which option leads toward it.ans
      const reach = (target, from) => {
        if (from[0] === "=") return from.slice(1) === target;
        return NODES[from].opts.some(o => reach(target, o[1]));
      };
      return NODES[n].opts.findIndex(o => reach(it.ans, o[1]));
    }
    function draw() {
      app.querySelector("#path").innerHTML = path.map(p => `<li><span class="a">✓ ${p[1]}</span><span class="q">${p[0]}</span></li>`).join("");
      const nd = NODES[node];
      app.querySelector("#step").innerHTML = `<p class="prompt">${nd.q}</p><div class="opts">${nd.opts.map((o, k) => `<button data-k="${k}">${o[0]}</button>`).join("")}</div>`;
      app.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
        const k = +b.dataset.k, good = correctNext(node);
        if (k !== good) {
          slips++; b.classList.add("wrong");
          app.querySelector("#fb").innerHTML = `<div class="feedback no"><span class="verdict">再看一次句子</span><p>${it.hint[node] || ""}</p></div>`;
          return;
        }
        markDay();
        app.querySelector("#fb").innerHTML = "";
        path.push([nd.q, nd.opts[k][0]]);
        const to = nd.opts[k][1];
        if (to[0] === "=") finish(); else { node = to; draw(); }
      });
    }
    function finish() {
      if (slips === 0) clean++;
      app.querySelector("#path").innerHTML = path.map(p => `<li><span class="a">✓ ${p[1]}</span><span class="q">${p[0]}</span></li>`).join("");
      app.querySelector("#step").innerHTML = "";
      const fill = it.ans === "what" ? "What" : it.ans;
      app.querySelector("#sent").innerHTML = sentenceHTML(it.s, fill);
      const extra = (it.ans === "who" || it.ans === "which") ? (it.comma ? "前面有逗號，所以不能用 that。" : "這裡也可以用 that。") : "";
      app.querySelector("#fb").innerHTML = `<div class="feedback ok"><span class="verdict">答案：${fill}</span><p>${Object.values(it.hint).join(" ")} ${extra}</p></div>`;
      app.querySelector("#next").hidden = false;
    }
    draw();
    app.querySelector("#next").onclick = () => { i++; i < list.length ? render() : doneScreen("關係詞判斷流程", "流程走完了",
      `<div class="score">${clean}<small> / ${list.length}</small></div><p class="muted">每一步都判斷正確的句子數。熟了之後，這三個問題會在腦中幾秒內跑完。</p>`, treeMode); };
  }
  render();
}

/* =================== CHEAT SHEET =================== */
function cheat() {
  screen(`
    <button class="back" id="back">‹ 回首頁</button>
    <header class="top"><span class="eyebrow">考前複習</span><h2>重點速查</h2></header>
    ${TOPICS.map((t, i) => `<section class="panel cheat"><h3><span class="tag">${i + 1}</span>${t.name}</h3>${rulesHTML(t)}${t.words ? wordsHTML(t) : ""}${t.family ? `<span class="eyebrow">長得像、意思不同</span>${twinsHTML()}` : ""}</section>`).join("")}`);
  bindBack();
}

if (!GATE.hash || unlocked()) start(); else gate();
